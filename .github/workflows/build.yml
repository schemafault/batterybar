name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: BatteryBar
          path: build/Release/BatteryBar.exe
      # Pushing a tag such as v1.0.0 publishes the exe as a GitHub release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/Release/BatteryBar.exe --title "BatteryBar ${{ github.ref_name }}" --generate-notes
